[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "mlops_wine_module"
version = "0.0.1"
description = "An activity using MLOps best practices."
authors = [
  { name = "David" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = ">=3.10"


[tool.ruff]
line-length = 99
src = ["mlops_wine_module"]
include = ["pyproject.toml", "mlops_wine_module/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["mlops_wine_module"]
force-sort-within-sections = true

